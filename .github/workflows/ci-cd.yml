name: Build and deploy
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
        build-backend:
            runs-on: ubuntu-latest
            outputs:
                sha: ${{ steps.var.outputs.sha }}
            steps:
                - name: Checkout code
                  uses: actions/checkout@v6

                - name: install dependencies
                  working-directory: ./backend
                  run: npm install

                - name: Lint
                  working-directory: ./backend
                  run: npm run lint
                  continue-on-error: true


                - name: Test
                  working-directory: ./backend
                  run: npm test
                  continue-on-error: true


                - name: Login to Docker Hub
                  uses: docker/login-action@v4
                  with:

                    username: ${{ secrets.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_PASSWORD }}
                  
                - name: Determine SHA tag
                  id: var
                  run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

                - name: Set up QEMU
                  uses: docker/setup-qemu-action@v4

                - name: Set up Docker Buildx
                  uses: docker/setup-buildx-action@v4

                - name: Build and push
                  uses: docker/build-push-action@v7
                  with:
                    context: ./backend
                    file: ./backend/Dockerfile
                    push: ${{ github.event_name == 'push' }}
                    load: ${{ github.event_name != 'push' }}

                    tags: samakn/backend-v1:${{ steps.var.outputs.sha }}




        build-frontend:
            runs-on: ubuntu-latest
            outputs:
                sha: ${{ steps.var.outputs.sha }}
            steps:
                - name: Checkout code
                  uses: actions/checkout@v6

                - name: install dependencies
                  working-directory: ./frontend
                  run: npm install

                - name: Lint
                  working-directory: ./frontend
                  run: npm run lint
                  continue-on-error: true

                - name: Test
                  working-directory: ./frontend
                  run: npm test
                  continue-on-error: true

                - name: Login to Docker Hub
                  uses: docker/login-action@v4
                  with:
                    username: ${{ secrets.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_PASSWORD }}

                - name: Determine SHA tag
                  id: var
                  run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

                - name: Set up QEMU
                  uses: docker/setup-qemu-action@v4

                - name: Set up Docker Buildx
                  uses: docker/setup-buildx-action@v4

                - name: Build and push
                  uses: docker/build-push-action@v7
                  with:
                    context: ./frontend
                    file: ./frontend/Dockerfile
                    push: ${{ github.event_name == 'push' }}
                    load: ${{ github.event_name != 'push' }}
                    tags: samakn/frontend-v1:${{ steps.var.outputs.sha }}


        deploy-backend:
            needs: build-backend
            if: github.event_name == 'push'
            runs-on: ubuntu-latest
            steps:
                - name: Checkout code
                  uses: actions/checkout@v6

                - name: SSH and update backend
                  uses: appleboy/ssh-action@v1.0.3
                  with:
                    host: ${{ secrets.PUBLIC_IP_ADRRESS}}
                    username: ubuntu
                    key: ${{ secrets.SSH_PRIVATE_KEY }}
                    script: |
                        #Authenicate with Dockerfile
                        echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
                       
                      
                        
                        docker pull samakn/backend-v1:${{ needs.build-backend.outputs.sha }}
                        export IMAGE=samakn/backend-v1:${{ needs.build-backend.outputs.sha }}

                        docker stop backend || true
                        docker rm backend || true
                        docker run -d --name backend -p 4000:4000 ${IMAGE}


        deploy-frontend:
            needs: build-frontend
            if: github.event_name == 'push'
            runs-on: ubuntu-latest
            steps:
                - name: Checkout code
                  uses: actions/checkout@v6   

                - name: SSH and update frontend
                  uses: appleboy/ssh-action@v1.0.3
                  with:
                    host: ${{ secrets.PUBLIC_IP_ADRRESS}}
                    username: ubuntu
                    key: ${{ secrets.SSH_PRIVATE_KEY }}
                    script: |
                        #Authenicate with Dockerfile
                        echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
                 

                        docker pull samakn/frontend-v1:${{ needs.build-frontend.outputs.sha }}
                        export IMAGE=samakn/frontend-v1:${{ needs.build-frontend.outputs.sha }}

                        docker stop frontend || true
                        docker rm frontend || true
                        docker run -d --name frontend -p 3000:3000 ${IMAGE}


                  