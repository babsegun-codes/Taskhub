services:

  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongodb
      MONGO_INITDB_ROOT_PASSWORD: mongodbpassword

    volumes:
      - mongodb_data:/data/db

  
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
  
    ports:
      - "3001:3001"
    depends_on:
     - mongo

    env_file:
      - ./backend/.env
        


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3005:3000"
    depends_on:
      - backend

volumes:
  mongodb_data: